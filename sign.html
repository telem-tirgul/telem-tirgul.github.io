    *{ box-sizing:border-box; }

  body{

  [hidden]{ display:none !important; }
  select.locked{ background-image:none !important; opacity:1; background-color:var(--bg); color:var(--ink); font-weight:700; cursor:not-allowed; }
  .lock-note{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }

  /* ===== תלם 5.19.46: עיצוב חדש לטפסים - קרם, בורדו וזהב (כמו מסך המאגר). רק מראה, בלי שינוי בלוגיקה ===== */
  /* רק במצב בהיר (במצב כהה של הטלפון - נשאר העיצוב הכהה הקיים) */
  @media not all and (prefers-color-scheme: dark){
  @media not all and (prefers-color-scheme: dark){

  .intro{ border-radius:18px; border:1px solid var(--border); border-inline-start:5px solid var(--accent); box-shadow:0 1px 3px rgba(60,30,20,.05); }
  fieldset{ background:var(--paper); border:1px solid var(--border); border-radius:20px; padding:18px 20px 8px; margin-bottom:18px; box-shadow:0 1px 3px rgba(60,30,20,.05); }

  input[type=text], input[type=email], input[type=tel], select, textarea{ border-radius:12px; }

  .track-info{ border-radius:16px; }

  /* שדה שנקבע בקישור (נעול) - רקע בהיר, כיתוב רגיל (לא מודגש) */

  .sig-box{ border-radius:14px; }

  :root{ --bg:#FBF8F3; } body{ background:#F8F4ED; }
  /* תלם 5.19.46: הטופס בחלקים ממוספרים (כמו המרתון) */

  }

  .q-go{ display:block; width:100%; margin:14px 0 8px; padding:14px; border:0; border-radius:12px; background:var(--accent, #8B1E23); color:#fff; font:inherit; font-size:17px; font-weight:800; cursor:pointer; }
  .q-go:disabled{ opacity:.7; cursor:default; } .q-err{ color:#A33A35; margin-top:10px; font-weight:600; } .q-lock{ color:#6B5F55; font-size:13px; text-align:center; }
  .recur-sub{ display:block; font-size:12.5px; color:#6B5F55; font-weight:400; margin-top:3px; line-height:1.45; }

<style>
  .ro-val{ background:#F6F1E7 !important; color:#2B2320 !important; font-weight:700; }
  .done-box{ background:#EEF7EA; border:1.5px solid #9BC98A; border-radius:12px; padding:18px; text-align:center; font-size:17px; font-weight:700; }
  .bad-box{ background:#FBEDEC; border:1.5px solid #E4A8A3; border-radius:12px; padding:18px; text-align:center; font-size:16px; font-weight:700; }
  .disclaimer{ font-weight:800; font-size:15.5px; text-align:center; margin:14px 0 6px; color:#2B2320; }
  .ti-box{ border:1.5px solid #E2C98F; background:#FBF5E8; border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .ti-box h3{ margin:0 0 4px; font-size:16px; } .ti-box p{ margin:0 0 6px; font-size:14.5px; } .ti-box ul{ margin:0; padding-inline-start:18px; font-size:14.5px; }
  .preview-banner{ position:sticky; top:0; z-index:50; background:#C9A45C; color:#2B2320; font-weight:800; text-align:center; padding:8px 12px; font-size:14px; }

  /* 5.19.55 (הלקוחה): שדות שהדפדפן מילא אוטומטית - בלי הרקע הכחול, באותו צבע כמו שאר השדות */
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, textarea:-webkit-autofill, select:-webkit-autofill{
    -webkit-box-shadow:0 0 0 1000px var(--af-bg, #FAF8F5) inset !important; box-shadow:0 0 0 1000px var(--af-bg, #FAF8F5) inset !important;
    -webkit-text-fill-color:currentColor !important; transition:background-color 99999s ease 0s; }
  input:-webkit-autofill:focus{ --af-bg:#fff; }
  input:autofill{ background-color:var(--af-bg, #FAF8F5) !important; }
  @media (prefers-color-scheme: dark){ input:-webkit-autofill, textarea:-webkit-autofill, select:-webkit-autofill{ --af-bg:var(--card, #2a2522); } }
  /* 5.19.55: שדה חסר / לא תקין - מסגרת אדומה בולטת והודעה גדולה יותר */
  .field.invalid input, .field.invalid select, .field.invalid textarea{ border:1.5px solid #C9554F !important; }   /* הלקוחה: פחות אדום - רק מסגרת */
  .field.invalid .error-msg, .consent .error-msg:not(:empty), #sigError:not(:empty){ font-size:13.5px !important; font-weight:700 !important; color:#B8463F !important; margin-top:4px; }
  .field.invalid .error-msg::before{ content:"⚠ "; }

  /* ===== 5.19.83 (נועה): שדות לבנים כמו במערכת הניהול – לא שמנת. פינות 8, גובה 44 בכל הטפסים ===== */
  @media not all and (prefers-color-scheme: dark){
    :is(input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], select, textarea):not(.field.invalid *){ background-color:#fff !important; border:1.5px solid #E5DDD3 !important; }
    :is(input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], select, textarea):not(.field.invalid *):focus{ border-color:#C9A45C !important; box-shadow:0 0 0 3px rgba(90,18,22,.10) !important; outline:none; }
    input:-webkit-autofill, textarea:-webkit-autofill, select:-webkit-autofill{ --af-bg:#fff; }
    input:autofill{ --af-bg:#fff; }
  }
  :is(input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], select, textarea){ border-radius:8px !important; }
  :is(input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], select){ min-height:44px !important; height:44px; padding-block:8px !important; box-sizing:border-box; }

  /* 5.19.84 (נועה): שדה נעול / לקריאה בלבד – דהוי: מסגרת חלשה מאוד, טקסט אפור, בלי רקע ובלי חץ */
  body .field :is(select.locked, input.locked, select:disabled, input:disabled, input.ro-val, input[readonly]):not(.q1):not(.q2):not(.q3){
    background-color:transparent !important; background-image:none !important; border:1.5px solid #EFEAE3 !important; box-shadow:none !important;
    color:#6B5F55 !important; -webkit-text-fill-color:#6B5F55; font-weight:400 !important; opacity:1; cursor:default; }

  /* 5.19.84 (נועה): רקע הדף כמו במערכת הניהול – המסגרות הלבנות בולטות עליו */
  @media not all and (prefers-color-scheme: dark){ body{ background:#F6F3EF !important; } }


  /* ===== 5.19.84 (נועה): כל הטפסים בעיצוב של טופס המרתון (המרתון = הטופס שסגרנו) ===== */
  .intro{ background:var(--paper) !important; border:1px solid var(--accent) !important; border-radius:16px !important; box-shadow:none !important;
    padding:14px 14px 12px !important; margin:0 0 10px !important; font-size:15.5px; line-height:1.7; color:var(--ink); }
  fieldset, .sec-card{ border-width:1px !important; }
  fieldset > legend, .sec-card > .sec-h{ font-size:17.5px !important; font-weight:800; color:var(--accent); padding-bottom:12px !important; margin-bottom:10px !important; }
  fieldset > legend::before, .sec-card > .sec-h::before{ width:26px !important; height:26px !important; font-size:13.5px !important; }
  .field > label, .field label{ font-size:14px !important; font-weight:700; color:var(--ink-soft) !important; }
  @media (max-width:520px){ .field > label, .field label{ font-size:13.5px !important; } }
  .amount-row:not(.amount-row-recur){ background:linear-gradient(135deg, rgba(90,18,22,.07), rgba(217,164,65,.10)) !important; border:1px solid rgba(90,18,22,.35) !important;

  .amount-row:not(.amount-row-recur) span{ font-weight:800; font-size:16px; color:var(--accent); } .amount-row:not(.amount-row-recur) strong{ font-size:22px !important; font-weight:900; color:var(--accent); }
  .amount-row-recur{ border-radius:14px !important; padding:12px 16px !important; }
  .consents-box{ background:#FAF8F5 !important; border:1px solid #E6E0D8 !important; border-radius:14px !important; padding:12px 14px !important; margin:10px 0 4px !important; display:grid !important; gap:10px; }
  .consents-box .consent, .consent{ margin:0 !important; font-size:14px !important; color:var(--ink) !important; line-height:1.55; cursor:pointer; gap:8px; }
  .consents-box .consent input, .consent input[type=checkbox]{ width:20px; height:20px; flex:0 0 auto; margin-top:1px !important; accent-color:#8B1E23; }
  .consents-box .error-msg:empty{ display:none; }
  .terms-box{ background:#FAF8F5 !important; border:1px solid #E6E0D8 !important; border-radius:12px !important; padding:14px 16px !important; margin:16px 0 10px !important;
    font-size:12.5px; color:var(--ink-soft); max-height:190px; }
  .sig-box{ background:#FDFBF8 !important; border:1px dashed #E6E0D8 !important; border-radius:14px !important; }
  .pm-title{ font-family:'Heebo',sans-serif; font-size:16px; font-weight:800; color:var(--ink); margin:16px 0 6px; }
  .submit-wrap{ margin-top:22px !important; }
  button#submitBtn{ background:linear-gradient(160deg, #8B1E23, #5A1216) !important; font-size:16.5px !important; padding:15px 14px !important; max-width:380px !important; width:100%;
    box-shadow:0 8px 22px rgba(90,18,22,.28) !important; border-radius:999px; }
  footer{ margin-top:26px !important; }
  /* מחשב – רוחב כמו בטופס המרתון */
  @media (min-width:900px){
    body{ padding-inline:28px; } .wrap{ max-width:1000px !important; }
    button#submitBtn{ font-size:18px !important; padding:16px 24px !important; }
    .field > label, .field label{ font-size:14px !important; }
  }

  /* ===== 5.19.84 (נועה): כמו במערכת – שם השדה צמוד לשדה ומיושר לטקסט שבתוכו; כוכבית חובה באדום ===== */
  .field > label, .field > .field-title{ display:block; padding-inline-start:11px !important; margin-bottom:-3px !important; line-height:1.3; }
  .sig-lbl, .pm-title{ padding-inline-start:0; }
  :is(input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], select){ padding-inline:10px !important; }
  select{ padding-inline-end:36px !important; }
  .req, label .req, .sig-lbl .req{ color:#B3241F !important; font-weight:800; }

        ctx.font = "700 23px " + FONT; ctx.fillStyle = "#2B2320"; ctx.fillText(lab, W - M, yR);

  // איסוף הנתונים מהטופס עצמו (כל שדה שמוצג וממולא, לפי הסדר)
  function collectFormForPdf(form){

    form.querySelectorAll("legend, .field").forEach(function(el){
      if (el.tagName === "LEGEND") { if (vis(el) && !el.closest(".field")) { cur = { title: el.textContent.trim(), rows: [] }; sections.push(cur); } return; }
      if (!vis(el)) return;

  function callSupabase(fnName, payload){

function rpcRaw(fn, body){
  const s = CONFIG.supabase, headers = { "Content-Type": "application/json", "apikey": s.anonKey };
  return fetch(s.url + "/rest/v1/rpc/" + fn, { method: "POST", headers: headers, body: JSON.stringify(body) })
    .then(r => r.json().catch(() => null).then(b => { if (!r.ok) throw new Error((b && b.message) || "HTTP " + r.status); return b; }));
}
const PHONE = "052-9067101";
var LINK = null;

function loadTerms(city){

    const doc = new DOMParser().parseFromString(html, "text/html"), src = doc.getElementById("termsBox");
    if (!src) throw new Error("no terms");

    box.innerHTML = ""; [].slice.call(src.childNodes).forEach(n => box.appendChild(document.importNode(n, true)));
    const tc = doc.querySelector('[data-t="t077"]'); if (tc) $("termsText").textContent = tc.textContent.trim();
    const s = CONFIG.supabase;
    const texts = fetch(s.url + "/rest/v1/form_texts?select=key,value&form=eq.register", { headers: { apikey: s.anonKey } }).then(r => r.ok ? r.json() : []).then(function(rows){
      const m = {}; (rows || []).forEach(x => { m[x.key] = x.value; });
      box.querySelectorAll("[data-t]").forEach(function(el){ const v = m[el.getAttribute("data-t")]; if (v != null && window.TX && TX.clean) el.innerHTML = TX.clean(v); });
      if (m.t077 != null && window.TX && TX.toPlain) { const d = document.createElement("div"); d.innerHTML = TX.clean(m.t077); $("termsText").textContent = d.textContent.trim(); }

}

var TERMS_OK = false;
